name: flet_nodes
description: Flet FletNodes control
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flet: ^0.80.5
  flutter:
    sdk: flutter
  flutter_shaders: ^0.1.3
  uuid: ^4.5.1
  vector_math: ^2.1.4
  
  # Local fl_nodes_core package (path dependency)
  fl_nodes_core:
    path: lib/fl_nodes_core

  # your dependencies here

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test_coverage_badge: ^0.3.2

flutter:
  uses-material-design: true
  generate: true
  shaders:
    - lib/fl_nodes_core/lib/shaders/grid.frag