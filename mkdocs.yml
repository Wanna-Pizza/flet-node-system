site_name: Flet Node System
site_description: 'Visual node editor + async Python runtime for dataflow applications'
site_author: 'Flet Contributors'
repo_url: https://github.com/Wanna-Pizza/flet-node-system
repo_name: flet-node-system

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
  palette:

  # Dark mode
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  - mkdocstrings:
      handlers:
        python:
          selection:
            docstring_style: google

nav:
  - Home: index.md
  - Interface: interface.md
  - Development: development.md
  - Architecture: architecture.md
  - Examples: examples.md
  - ForEach: foreach.md
  - Engine: engine.md
  - Building: building.md