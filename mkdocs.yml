site_name: Flet Node System
site_description: 'Visual node editor + async Python runtime for dataflow applications'
site_author: 'Flet Contributors'
repo_url: https://github.com/Wanna-Pizza/flet-node-system
repo_name: flet-node-system

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: blue
      accent: cyan

plugins:
  - mkdocstrings:
      handlers:
        python:
          selection:
            docstring_style: google

nav:
  - Home: index.md
  - Interface: interface.md
  - Development: development.md
  - Architecture: architecture.md
  - Examples: examples.md
  - Engine: engine.md
  - Building: building.md